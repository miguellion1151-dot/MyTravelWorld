name: Build MyTravelWorld APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack MyTravelWorld source
        shell: bash
        run: |
          test -f MyTravelWorld_Source.zip
          rm -rf cloud-project
          mkdir cloud-project
          unzip -q MyTravelWorld_Source.zip -d cloud-project
          test -f cloud-project/MyTravelWorld/settings.gradle.kts

      - name: Build debug APK
        shell: bash
        working-directory: cloud-project/MyTravelWorld
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        shell: bash
        run: cp cloud-project/MyTravelWorld/app/build/outputs/apk/debug/app-debug.apk MyTravelWorld-V7.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTravelWorld-V7.3-APK
          path: MyTravelWorld-V7.3.apk
          if-no-files-found: error
